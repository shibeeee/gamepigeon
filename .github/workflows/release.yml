# Push a tag like v1.0.0 to publish a GitHub Release with a downloadable zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - name: Build the zip
        run: |
          mkdir -p dist/pigeon-pal
          cp -r index.html css js data icons manifest.webmanifest sw.js README.md dist/pigeon-pal/
          cd dist && zip -qr "pigeon-pal-${GITHUB_REF_NAME}.zip" pigeon-pal
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/pigeon-pal-${GITHUB_REF_NAME}.zip" \
            --title "Pigeon Pal ${GITHUB_REF_NAME}" --notes-file .github/RELEASE_NOTES.md
