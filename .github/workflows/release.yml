# Publishes a GitHub Release with a downloadable zip. Either push a tag like
# v1.0.1, or run this workflow from the Actions tab and type a version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v1.0.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - name: Build the zip
        run: |
          mkdir -p dist/pigeon-pal
          cp -r index.html css js data icons vendor manifest.webmanifest sw.js README.md LICENSE THIRD_PARTY.md dist/pigeon-pal/
          rm -f dist/pigeon-pal/data/c4book-*.js
          cd dist && zip -qr "pigeon-pal-${VERSION}.zip" pigeon-pal
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" "dist/pigeon-pal-${VERSION}.zip" --target "$GITHUB_SHA" \
            --title "Pigeon Pal ${VERSION}" --notes-file .github/RELEASE_NOTES.md
